<style>

.panel{padding:1.8cqw;display:flex;flex-direction:column;gap:1cqw}

.prog{height:1.6cqw;border-radius:1cqw;background:#bcd6ee;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#2fd5a3,#4db8ff);transition:width .3s}
.bigic{font-size:14cqw;text-align:center;line-height:1.1}.cv{font:400 6cqw Jua;text-align:center;letter-spacing:1.2cqw;background:#06182c;color:#2fd5a3;border-radius:1.6cqw;padding:.6cqw;margin:1.2cqw 0;min-height:9cqw;text-shadow:0 0 1.5cqw #2fd5a3}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw;max-width:34cqw;margin:0 auto 1.2cqw}.pad button{padding:.7cqw;font:400 3.4cqw Jua;border:0;border-radius:1.4cqw;background:#fff;box-shadow:0 .5cqw 0 #8fb4d4}

.simg{display:grid;grid-template-columns:1.5fr 1fr;gap:1.4cqw;padding:1.4cqw;background:linear-gradient(#0e3a66,#0a2a4d);color:#fff}

.fn{padding:0;display:block;min-height:0;background:#0a2a4d}.fn .board{position:relative;aspect-ratio:16/9}.fn svg{position:absolute;inset:0;width:100%;height:100%}

/* Responsive layout fixes */

@keyframes marineEscape{0%{opacity:0;transform:translate(-50%,-50%)}12%{opacity:1;outline:.45cqw solid #2fd5a3;box-shadow:0 0 2cqw #2fd5a3}38%{opacity:1;transform:translate(-50%,-50%);filter:drop-shadow(0 0 1.4cqw #2fd5a3)}70%{opacity:.55;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-50%)}}

<script>
const $=id=>document.getElementById(id);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const R=seed=>{let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647;};
/* ===== Sound ===== */
let snd=true,ac=null;
function beep(seq,type="sine",vol=.07){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);t+=d*.85;});}catch(_){}}

// Ceiling pendant light: on = glowing warm cone; off = dark shade, grey bulb
function svgLamp(found){
 return `<svg viewBox="0 0 80 90" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
   <radialGradient id="bulbGlow" cx="50%" cy="60%" r="55%">
    <stop offset="0%" stop-color="#fffbe0"/>
    <stop offset="60%" stop-color="#ffe87a" stop-opacity=".7"/>
    <stop offset="100%" stop-color="#ffc94a" stop-opacity="0"/>
   </radialGradient>
  </defs>
  <!-- ceiling mount -->
  <rect x="33" y="0" width="14" height="5" rx="2" fill="#b09070"/>
  <!-- cord -->
  <line x1="40" y1="5" x2="40" y2="22" stroke="#7a5c3a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- socket cap -->
  <ellipse cx="40" cy="24" rx="6" ry="4" fill="#c49a30"/>
  <!-- ON state -->
  <g id="lamp-on" style="display:${found?'none':'block'}">
   <!-- large glow cone spreading downward -->
   <ellipse cx="40" cy="72" rx="38" ry="14" fill="url(#bulbGlow)" opacity=".55"/>
   <!-- shade outer -->
   <path d="M12 52L23 72H57L68 52Z" fill="#e8ba28" stroke="#b88c14" stroke-width="2" stroke-linejoin="round"/>
   <!-- shade rim highlight -->
   <line x1="12" y1="52" x2="68" y2="52" stroke="#f5d040" stroke-width="2.5"/>
   <!-- shade inner shadow -->
   <path d="M16 52L25 68H55L64 52Z" fill="#c49a18" opacity=".35"/>
   <!-- bulb (bright) -->
   <ellipse cx="40" cy="40" rx="9" ry="11" fill="#fff8c0" stroke="#e0c040" stroke-width="1.5"/>
   <ellipse cx="40" cy="36" rx="4" ry="5" fill="#fffde0" opacity=".9"/>
   <!-- filament hint -->
   <path d="M37 42 Q40 38 43 42" fill="none" stroke="#e0a020" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- OFF state -->
  <g id="lamp-off" style="display:${found?'block':'none'}">
   <!-- shade outer (dark) -->
   <path d="M12 52L23 72H57L68 52Z" fill="#7a6a45" stroke="#4a3e20" stroke-width="2" stroke-linejoin="round"/>
   <line x1="12" y1="52" x2="68" y2="52" stroke="#5a4e28" stroke-width="2.5"/>
   <path d="M16 52L25 68H55L64 52Z" fill="#3a3018" opacity=".4"/>
   <!-- bulb (off, grey) -->
   <ellipse cx="40" cy="40" rx="9" ry="11" fill="#b0a888" stroke="#7a7055" stroke-width="1.5"/>
  </g>
 </svg>`;
}

// TV: on = bright colourful screen; off = dark screen
function svgTV(found){
 return `<svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
   <linearGradient id="tvBody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#383c4a"/>
    <stop offset="100%" stop-color="#22252e"/>
   </linearGradient>
  </defs>
  <!-- TV body -->
  <rect x="2" y="2" width="96" height="64" rx="6" fill="url(#tvBody)" stroke="#14161c" stroke-width="2"/>
  <!-- screen bezel inset -->
  <rect x="8" y="8" width="84" height="50" rx="3" fill="#101214"/>
  <!-- ON state -->
  <g id="tv-on" style="display:${found?'none':'block'}">
   <!-- screen background -->
   <rect x="9" y="9" width="82" height="48" rx="2" fill="#1060a0"/>
   <!-- content: bright sky top -->
   <rect x="9" y="9" width="82" height="16" rx="2" fill="#38b4f0"/>
   <!-- content: land bottom -->
   <rect x="9" y="45" width="82" height="12" rx="0" fill="#3a9a3a"/>
   <!-- colour cast / drama -->
   <rect x="9" y="25" width="82" height="20" fill="#1a5090" opacity=".5"/>
   <!-- bright highlight top-left (looks like a real screen) -->
   <ellipse cx="30" cy="18" rx="18" ry="7" fill="#ffffff" opacity=".08"/>
   <!-- power LED green -->
   <circle cx="92" cy="60" r="2.5" fill="#22ff55"/>
   <circle cx="92" cy="60" r="5" fill="#22ff55" opacity=".2"/>
  </g>
  <!-- OFF state -->
  <g id="tv-off" style="display:${found?'block':'none'}">
   <!-- dark screen -->
   <rect x="9" y="9" width="82" height="48" rx="2" fill="#080a0c"/>
   <!-- faint room reflection -->
   <ellipse cx="35" cy="26" rx="20" ry="10" fill="#ffffff" opacity=".03"/>
   <!-- power LED off -->
   <circle cx="92" cy="60" r="2.5" fill="#441111"/>
  </g>
  <!-- stand neck -->
  <path d="M46 66L42 76H58L54 66Z" fill="#22252e" stroke="#14161c" stroke-width="1.5"/>
  <!-- stand base -->
  <rect x="28" y="74" width="44" height="5" rx="2.5" fill="#14161c"/>
 </svg>`;
}

let pct=0;
function showPre(){setMain(`<div class="scr pre"><div class="ttl">SAVE THE EARTH</div><div style="width:12cqw;height:12cqw" class="float">${NORI("sad")}</div><div id="pt" style="font-size:2.2cqw">LOADING... 0%</div><div class="lbar"><i id="pb"></i></div><button id="go" class="btn hidden blink" onclick="showMenu()">▶ CLICK TO START</button></div>`);
 const iv=setInterval(()=>{pct=Math.min(100,pct+Math.random()*13);$("pb").style.width=pct+"%";$("pt").textContent=`LOADING... ${Math.floor(pct)}%`;if(pct>=100&&Store.ready){clearInterval(iv);$("pt").textContent="READY!";$("go").classList.remove("hidden");$("go").focus();}},110);timers.push(iv);}
function showMenu(){S.ok();setMain(`<div class="scr menu"><svg class="ice" viewBox="0 0 320 100" preserveAspectRatio="none"><path d="M0 40Q40 24 80 38T160 34T240 40T320 30V100H0Z" fill="#fff"/><path d="M0 60Q60 48 120 60T240 58T320 56V100H0Z" fill="#d4efff"/></svg>
 <div class="ttl" style="position:relative">SAVE THE EARTH</div><div class="jua" style="font-size:3.2cqw;color:#fff;position:relative">Small actions can protect our planet!</div>
 <div style="width:17cqw;height:17cqw;position:relative" class="float">${NORI("sad")}</div>
 <label for="sel" style="position:absolute;left:-999px">Number</label><select id="sel" class="sel" style="position:relative"><option value="">▼ Choose your number</option></select>
 <button class="btn g" style="position:relative" onclick="login()">PLAY ▶</button></div>`);const s=$("sel");for(let i=1;i<=99;i++)s.add(new Option(`${i}`,i));}
async function login(){const n=+$("sel").value;if(!n){fail("Please choose your number first!");return;}await Store.save(n,{logged_in:true,last_login_at:new Date().toISOString()});me=n;$("hud").classList.remove("hidden");S.ok();hud();const d=Store.get(n);if(d.stage_1_completed)showMap();else story(0);}
const bi=(e,k)=>`${e}<br><small style="opacity:.7;font-size:.8em">${k}</small>`;
const STORY=[["sad",bi("Nori is a baby polar bear. One day, the ice he lived on melted away… 😢","Nori is a baby polar bear 'Nori'. One day, the ice Nori lived on melted away…")],["sad",bi("The reason is global warming! Greenhouse gases are making the Earth hotter.","Global warming is making the Earth hotter. Greenhouse gases trap heat.")],["happy",bi("Nori was scared and hid somewhere on Earth. Find the clues and save him! 🔍","Nori was scared and hid. Find clues and help him!")]];
function story(i){const [m,t]=STORY[i];setMain(`<div class="scr" style="background:linear-gradient(#0c3566,#2a86c2)"><div style="width:20cqw;height:20cqw" class="float">${NORI(m)}</div><div class="bub" style="font-size:2.3cqw;max-width:56cqw;text-align:center">${t}</div><div style="display:flex;gap:1cqw"><button class="btn b sm" onclick="showMap()">Skip</button><button class="btn g" onclick="${i<2?`story(${i+1})`:"showMap()"}">${i<2?"Next ▶":"Let’s Go! ▶"}</button></div></div>`);}
/* ===== HUD and Map ===== */

 const slide=(to)=>{const from=pan,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/450);setPan(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);})(t0);};

 vp.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>6)moved=true;if(moved)setPan(drag.p-dx);});
